<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>滑雪计时</title>
  <meta name="description" content="记录滑雪时长、分趟与历史统计的离线小工具" />
  <meta name="theme-color" content="#070b12" />
  <meta name="color-scheme" content="dark" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="滑雪计时" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 图标精灵：线性 SVG（Lucide 几何风格），跟随 currentColor，
     不用 emoji —— emoji 跨平台渲染不一致且无法用 CSS 控制颜色/粗细 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-timer">
      <line x1="10" y1="2" x2="14" y2="2" />
      <line x1="12" y1="14" x2="15" y2="11" />
      <circle cx="12" cy="14" r="8" />
    </g>
    <g id="i-list">
      <line x1="8" y1="6" x2="21" y2="6" />
      <line x1="8" y1="12" x2="21" y2="12" />
      <line x1="8" y1="18" x2="21" y2="18" />
      <line x1="3" y1="6" x2="3.01" y2="6" />
      <line x1="3" y1="12" x2="3.01" y2="12" />
      <line x1="3" y1="18" x2="3.01" y2="18" />
    </g>
    <g id="i-settings">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
      <circle cx="12" cy="12" r="3" />
    </g>
    <g id="i-mountain">
      <path d="m8 3 4 8 5-5 5 15H2L8 3z" />
    </g>
    <g id="i-x">
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    </g>
    <g id="i-chevron">
      <path d="m9 18 6-6-6-6" />
    </g>
  </defs>
</svg>

<div class="app">
  <main class="content" id="content">

    <!-- ============ 计时 ============ -->
    <section class="screen is-active" id="screen-timer">

      <div class="hint" id="installHint" hidden>
        <span>点底部「分享」→「添加到主屏幕」，即可全屏离线使用</span>
        <button type="button" id="hintClose" aria-label="关闭提示">
          <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-x" /></svg>
        </button>
      </div>

      <header class="topbar">
        <div class="brand">
          <svg class="ico ico-brand" aria-hidden="true" focusable="false"><use href="#i-mountain" /></svg>
          <span>滑雪计时</span>
        </div>
        <button type="button" class="chip" id="chipWake">屏幕常亮</button>
      </header>

      <div class="hero" id="hero" data-mode="idle">
        <div class="hero-status"><span class="dot"></span><span id="statusText">准备就绪</span></div>
        <div class="hero-time" id="mainTime">00:00:00</div>
        <div class="hero-caption" id="mainLabel">本次滑行总时长</div>
        <div class="hero-pill" id="livePill">点下方按钮开始计时</div>
      </div>

      <div class="stat-strip" id="timerStats">
        <div class="stat"><b id="statRuns">0</b><span>已滑趟数</span></div>
        <div class="stat"><b id="statLast">--:--</b><span>上一趟</span></div>
        <div class="stat"><b id="statRest">00:00</b><span>休息合计</span></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="btnPrimary">开始滑雪</button>
        <button type="button" class="btn btn-danger" id="btnEnd" hidden>结束本次并保存</button>
      </div>

      <div class="section">
        <div class="section-title">本次分趟 <span class="section-sub" id="runsCount"></span></div>
        <div class="run-list" id="liveRunList"></div>
      </div>
    </section>

    <!-- ============ 记录 ============ -->
    <section class="screen" id="screen-records">
      <header class="topbar">
        <div class="brand">
          <svg class="ico ico-brand" aria-hidden="true" focusable="false"><use href="#i-list" /></svg>
          <span>历史记录</span>
        </div>
      </header>

      <div class="stat-strip cols-2" id="summaryStrip">
        <div class="stat"><b id="sumSki">0</b><span>累计滑行</span></div>
        <div class="stat"><b id="sumRuns">0</b><span>累计趟数</span></div>
        <div class="stat"><b id="sumDays">0</b><span>滑雪天数</span></div>
        <div class="stat"><b id="sumBest">--</b><span>最长一趟</span></div>
      </div>

      <div class="section" id="trendSection" hidden>
        <div class="section-title">滑行趋势 <span class="section-sub" id="trendSub"></span></div>
        <div class="trend-card">
          <p class="trend-summary" id="trendSummary"></p>
          <div class="trend-chart" id="trendChart" role="img" aria-labelledby="trendSummary"></div>
          <button type="button" class="trend-toggle" id="trendToggle" aria-expanded="false" aria-controls="trendTable">
            查看数据表
          </button>
          <div class="trend-table" id="trendTable" hidden></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">全部记录 <span class="section-sub" id="sessionsCount"></span></div>
        <div class="session-list" id="sessionList"></div>
      </div>
    </section>

    <!-- ============ 设置 ============ -->
    <section class="screen" id="screen-settings">
      <header class="topbar">
        <div class="brand">
          <svg class="ico ico-brand" aria-hidden="true" focusable="false"><use href="#i-settings" /></svg>
          <span>设置</span>
        </div>
      </header>

      <div class="card">
        <label class="row">
          <div class="row-text">
            <div class="row-title">屏幕常亮</div>
            <div class="row-sub">滑行时尽量不让屏幕自动锁定（iOS 16.4+）</div>
          </div>
          <input type="checkbox" class="switch" id="setWake" />
        </label>
        <label class="row">
          <div class="row-text">
            <div class="row-title">提示音</div>
            <div class="row-sub">开始 / 结束一趟时发出短提示音</div>
          </div>
          <input type="checkbox" class="switch" id="setSound" />
        </label>
      </div>

      <div class="card">
        <button type="button" class="row row-btn" id="btnExportCsv">
          <span class="row-text"><span class="row-title">导出 CSV 表格</span><span class="row-sub">可用 Excel / 备忘录打开</span></span>
          <svg class="ico ico-chev" aria-hidden="true" focusable="false"><use href="#i-chevron" /></svg>
        </button>
        <button type="button" class="row row-btn" id="btnExportJson">
          <span class="row-text"><span class="row-title">导出 JSON 备份</span><span class="row-sub">完整数据，可换机恢复</span></span>
          <svg class="ico ico-chev" aria-hidden="true" focusable="false"><use href="#i-chevron" /></svg>
        </button>
        <button type="button" class="row row-btn" id="btnImportJson">
          <span class="row-text"><span class="row-title">导入 JSON 备份</span><span class="row-sub">与现有记录合并（自动去重）</span></span>
          <svg class="ico ico-chev" aria-hidden="true" focusable="false"><use href="#i-chevron" /></svg>
        </button>
        <button type="button" class="row row-btn is-danger" id="btnClearAll">
          <span class="row-text"><span class="row-title">清空全部数据</span><span class="row-sub">删除本机所有滑雪记录</span></span>
          <svg class="ico ico-chev" aria-hidden="true" focusable="false"><use href="#i-chevron" /></svg>
        </button>
        <input type="file" id="fileImport" accept="application/json,.json" hidden />
      </div>

      <p class="footnote">
        所有数据只保存在这台手机的本机浏览器里，不会上传到任何服务器。<br />
        清理 Safari 数据或删除主屏幕图标会丢失记录，建议定期「导出 JSON 备份」。<br />
        <span class="ver">版本 v1.1.0</span>
      </p>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button type="button" class="tab is-active" data-tab="timer">
      <svg class="ico ico-tab" aria-hidden="true" focusable="false"><use href="#i-timer" /></svg>
      <span>计时</span>
    </button>
    <button type="button" class="tab" data-tab="records">
      <svg class="ico ico-tab" aria-hidden="true" focusable="false"><use href="#i-list" /></svg>
      <span>记录</span>
    </button>
    <button type="button" class="tab" data-tab="settings">
      <svg class="ico ico-tab" aria-hidden="true" focusable="false"><use href="#i-settings" /></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-mask"></div>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 class="modal-title" id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
